name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: |
          python -I scripts/test_analyze.py
          python -I scripts/test_actions.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pane compiles
        run: npx -y esbuild@0.24 hooks/register.tsx --format=esm --jsx=automatic --log-level=warning --outfile=/tmp/register.js
